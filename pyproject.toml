[project]
name = "Content_analysis_project"
version = "0.1.0"
description = "Analyse de contenu d'entretiens en français avec LLM local"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "numpy",
  "streamlit",
  "spacy",
  "pydantic"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

